[project]
name = "invadrun"
version = "0.2.0"
description = "Plan the fastest route to flash every Space Invader in Paris: OSM walking graph + TSP -> GPX + FKT plan."
readme = "README.md"
license = { text = "Unlicense" }
requires-python = ">=3.11"
dependencies = [
    "osmnx>=2.0,<3",
    "networkx>=3.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "shapely>=2.0",
    "ortools>=9.10",
    "gpxpy>=1.6",
]

[project.scripts]
invadrun = "invadrun.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["invadrun"]

[tool.pytest.ini_options]
testpaths = ["tests"]
